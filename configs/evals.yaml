# expect_tool: a tool name the agent must call, or `none` to assert it answered
# without one. Omit it to leave tool choice unchecked.
cases:
  - agent: calc
    prompt: A box holds 24 pens. I buy 7 boxes and give away 13 pens. How many are left?
    expect_tool: calculator
    expect_answer_contains: ["155"]

  - agent: calc
    prompt: What is 17 times 23, plus 4?
    expect_tool: calculator
    expect_answer_contains: ["395"]

  - agent: files
    prompt: What Python version does pyproject.toml require?
    expect_tool: read_file
    expect_argument_contains: pyproject.toml
    expect_answer_contains: ["3.10"]

  - agent: files
    prompt: Which files are in the scripts directory?
    expect_tool: list_files
    expect_answer_contains: ["run_agent.sh"]

  - agent: search
    workspace: tests/fixtures/workspace
    prompt: Which file defines the normalize_scores function?
    expect_tool: grep
    expect_argument_contains: normalize_scores
    expect_answer_contains: ["pipeline.py"]

  - agent: files
    workspace: tests/fixtures/workspace
    prompt: What is the batch size in settings.json?
    expect_tool: read_file
    expect_argument_contains: settings.json
    expect_answer_contains: ["8"]

  - agent: python
    prompt: How many days are there between 2026-01-01 and 2026-09-06?
    expect_tool: run_python
    expect_answer_contains: ["248"]

  - agent: python
    prompt: What is the sum of the squares of the numbers 1 through 20?
    expect_tool: run_python
    expect_answer_contains: ["2870"]

  - agent: python
    prompt: How many characters are in the string "small agents run locally"?
    expect_tool: run_python
    expect_answer_contains: ["24"]

  - agent: extract
    prompt: Invoice from Dana Ruiz, dated 2026-03-14, for 412.50 USD of GPU rental.
    expect_tool: none
    expect_answer_contains: ["Dana Ruiz", "2026-03-14", "412.50"]

  - agent: chat
    prompt: In one sentence, what is a KV cache?
    expect_tool: none
    expect_answer_contains: ["cache"]
