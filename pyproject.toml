[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "root"
version = "0.1.0"
description = "Small tool-using agents on an open-weight sub-billion-parameter model"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.56",
    "accelerate>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
root = "root.run:main"
root-eval = "root.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/root"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
