[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "root"
version = "0.1.0"
description = "Small tool-using agents on an open-weight sub-billion-parameter model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.56",
    "accelerate>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "outlines>=1.3", "langdetect>=1.0.9", "nltk>=3.10.3"]
grammar = ["outlines>=1.3"]
eval = ["langdetect>=1.0.9", "nltk>=3.10.3"]
harbor = ["harbor[modal]>=0.22; python_version >= '3.12'"]

[project.scripts]
root = "root.run:main"
root-eval = "root.evaluate:main"
root-bench = "root.benchmark:main"
root-instruct = "root.instruct:main"

[tool.hatch.build.targets.wheel]
packages = ["src/root"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
