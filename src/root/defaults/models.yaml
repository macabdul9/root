# Models the /model command offers. A note saying "no tool calls in its
# template" means the model resolves to the generic format: the toolless agents
# (chat, code, extract) work, and a tool call cannot be forced. Gated models
# need `hf auth login` or HF_TOKEN before they will download.
#
# The sub-1B entries run in process. An id typed straight in above that ceiling
# is refused - openbmb/MiniCPM5-1B, at 1,080,632,832 parameters, is turned away
# - but an entry listed here skips the check, which is what lets the 27-31B
# models at the bottom be picked against a served engine.
#
# Models the /model command offers. Any Hugging Face id works with --model or
# /model, whether or not it is listed here; these are the ones that have been
# run against the eval set.
default: lfm2-350m

models:
  lfm2-350m:
    id: LiquidAI/LFM2.5-350M
    note: 350M, the default
  lfm2-230m:
    id: LiquidAI/LFM2.5-230M
    note: 230M, the smallest
  qwen3-06b:
    id: Qwen/Qwen3-0.6B
    note: 600M, JSON tool calls
  qwen35-08b:
    id: Qwen/Qwen3.5-0.8B
    note: 800M, XML tool calls
  qwen2.5-coder-0.5b:
    id: Qwen/Qwen2.5-Coder-0.5B-Instruct
    note: 494M, tuned for code, JSON tool calls
  qwen2.5-coder-0.5b-base:
    id: Qwen/Qwen2.5-Coder-0.5B
    note: 494M, base model, JSON tool calls
  gemma-3-270m:
    id: google/gemma-3-270m-it
    note: 268M, gated, no tool calls in its template
  gemma-3-1b:
    id: google/gemma-3-1b-it
    note: 1.00B, gated, no tool calls in its template
  k2-horizon-09b:
    id: IFM/K2-Horizon-0.9B
    note: 1.08B despite its name, runs code from its own repo
    # This model ships a custom architecture, so loading it executes Python from
    # the repository. Read https://hf.co/IFM/K2-Horizon-0.9B before using it,
    # or delete this entry.
    trust_remote_code: true

  # Far past the in-process ceiling: these only work behind a server, as
  # `--engine vllm` (or sglang/ollama) with the model already being served.
  # Loading one on the transformers engine will try to put tens of gigabytes of
  # weights in this process.
  qwen3.8-27b:
    id: Qwen/Qwen3.8-27B
    note: 27.8B, XML tool calls, served engine only
  qwen3-coder-30b-a3b:
    id: Qwen/Qwen3-Coder-30B-A3B-Instruct
    note: 30.5B MoE, tuned for code, XML tool calls, served engine only
  glm-4.7-flash:
    id: zai-org/GLM-4.7-Flash
    note: 31.2B MoE, GLM tool calls, served engine only
